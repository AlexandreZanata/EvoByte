name: Quick verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff
          pip install --no-deps -e .
      - name: Lint check
        run: |
          ruff check src tests benchmarks || true
          git diff --check
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Smoke dataset
        run: python benchmarks/synthetic.py --smoke
